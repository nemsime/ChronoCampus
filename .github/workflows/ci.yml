name: ChronoCampus CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install ODBC runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends unixodbc
      - name: Install backend and lint dependencies
        run: python -m pip install -e './backend[dev]' 'ruff==0.17.2'
      - name: Check Python correctness
        run: ruff check --isolated --select E4,E7,E9,F backend/app backend/tests backend/alembic
      - name: Run isolated backend tests
        run: python -m pytest backend/tests -q --junitxml=reports/pytest.xml
      - name: Save test report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ matrix.os }}
          path: reports/pytest.xml
          if-no-files-found: warn
          retention-days: 7
          overwrite: true

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm --prefix frontend ci
      - name: Check TypeScript
        run: npm --prefix frontend run typecheck
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Save frontend build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-${{ github.sha }}
          path: frontend/build/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  ci:
    name: CI
    needs: [backend, frontend]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every check to pass
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          printf 'Backend: %s\nFrontend: %s\n' "$BACKEND_RESULT" "$FRONTEND_RESULT"
          test "$BACKEND_RESULT" = success
          test "$FRONTEND_RESULT" = success

  delivery:
    name: Local delivery bundle
    needs: ci
    if: >-
      ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
          && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download this run's frontend build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-${{ github.sha }}
          path: package/frontend-build
          digest-mismatch: error
      - name: Package the tested source revision
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git archive --format=zip --output=package/source.zip HEAD
          git rev-parse HEAD > package/COMMIT.txt
          cp docs/delivery.md package/README.md
          cd package
          sha256sum source.zip frontend-build/index.html > SHA256SUMS.txt
      - name: Save verified local delivery bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chronocampus-local-${{ github.sha }}
          path: package/
          if-no-files-found: error
          retention-days: 7
          overwrite: true
